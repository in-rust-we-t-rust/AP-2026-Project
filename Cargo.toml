[workspace]
members = ["crates/*"]
default-members = ["crates/game"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.dependencies]
admirality = { path = "crates/admirality" }
cartographer = { path = "crates/cartographer" }
chart = { path = "crates/chart" }
island = { path = "crates/island" }
ship = { path = "crates/ship" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = "deny"
